name: Build IITStudentsOS APK
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Public HTTPS website URL the app should load
        required: true
        default: https://iit-connect-mu.vercel.app/
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mobile-android
        env:
          WEB_URL: ${{ github.event.inputs.web_url || 'https://iit-connect-mu.vercel.app/' }}
        run: gradle assembleDebug -PwebUrl="$WEB_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: IITStudentsOS-debug-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
